<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <title>Login</title>
    <style>
        .login-container {
            width: 40%;
            margin: 100px auto;
            padding: 30px;
            background-color: rgb(169, 169, 178);
            border-radius: 20px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-container button {
            width: 100%;
            margin-left: 0;
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
        }
        .signup-link a {
            color: rgb(10, 10, 69);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to Enrollment System</h2>
        <div class="row">
            <div class="col-1">
                <label>Email:</label>
            </div>
            <div class="col-2">
                <input type="email" id="email" placeholder="Enter your email">
            </div>
        </div>
        <div class="row">
            <div class="col-1">
                <label>Password:</label>
            </div>
            <div class="col-2">
                <input type="password" id="password" placeholder="Enter your password">
            </div>
        </div>
        <br>
        <button onclick="login()">Login</button>
        <div class="signup-link">
            <a href="signup.html">Don't have an account? Sign Up Here</a>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
